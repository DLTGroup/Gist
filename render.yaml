# Render Blueprint: New › Blueprint › pick this repo. You'll be asked for the secret values.
services:
  - type: web
    name: gist
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: gist-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GIST_TOKEN_KEY
        generateValue: true
      # Which models write gists, in order; later ones take over if earlier ones fail. See docs/MODELS.md.
      - key: GIST_MODELS
        value: anthropic/claude-opus-5-5
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # YouTube: captions first, Gemini watches the video when there are none (docs/MODELS.md)
      - key: GIST_YOUTUBE_MODE
        value: transcript-first
      - key: GIST_VIDEO_MODEL
        value: gemini-3.8-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GIST_EFFORT
        value: medium
      - key: GIST_DB_PATH
        value: /data/gist.db
