# Fly.io (Toronto region keeps data in Canada): fly launch --copy-config --no-deploy
# fly volumes create gist_data --region yyz --size 1
# fly secrets set ANTHROPIC_API_KEY=… DEEPGRAM_API_KEY=…  then  fly deploy
app = "gist-app"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  GIST_DB_PATH = "/data/gist.db"

[[mounts]]
  source = "gist_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
